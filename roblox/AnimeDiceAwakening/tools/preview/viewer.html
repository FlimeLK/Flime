<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scene preview</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Прев'ю сцени з export_scene.luau: деталі Roblox → three.js. Не точна копія рендеру Roblox,
// але форми, кольори, світло й неон дають чесне уявлення про вигляд карти.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, W / H, 0.5, 4000);
const data = await (await fetch('/scene.json')).json();

const ROUGH = { SmoothPlastic: 0.45, Plastic: 0.6, Marble: 0.25, Glass: 0.05, Metal: 0.35, DiamondPlate: 0.4, Ice: 0.1, Foil: 0.2 };
const matCache = new Map();
function material(p) {
  const key = p.col.join(',') + p.m + p.t;
  if (matCache.has(key)) return matCache.get(key);
  const color = new THREE.Color(p.col[0], p.col[1], p.col[2]);
  let m;
  if (p.m === 'Neon') {
    m = new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(2.2) });
  } else if (p.m === 'ForceField') {
    m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false });
  } else {
    m = new THREE.MeshStandardMaterial({ color, roughness: ROUGH[p.m] ?? 0.85, metalness: p.m === 'Metal' || p.m === 'DiamondPlate' || p.m === 'Foil' ? 0.6 : 0 });
  }
  if (p.t > 0 && p.m !== 'ForceField') {
    m.transparent = true;
    m.opacity = 1 - p.t;
    m.depthWrite = false;
  }
  matCache.set(key, m);
  return m;
}

function wedgeGeometry(x, y, z) {
  // Схил WedgePart дивиться вперед (-Z) і вгору; висока грань — ззаду (+Z)
  const hx = x / 2, hy = y / 2, hz = z / 2;
  const P = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, hz], [hx, hy, hz]];
  const tris = [[0, 1, 2], [0, 2, 3], [3, 2, 5], [3, 5, 4], [0, 4, 5], [0, 5, 1], [0, 3, 4], [1, 5, 2]];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat().flatMap(i => P[i]), 3));
  g.computeVertexNormals();
  return g;
}
function geometry(p) {
  const [x, y, z] = p.sz;
  if (p.c === 'WedgePart') return wedgeGeometry(x, y, z);
  if (p.s === 'Ball') return new THREE.SphereGeometry(Math.min(x, y, z) / 2, 24, 16);
  if (p.s === 'Cylinder') {
    const g = new THREE.CylinderGeometry(Math.min(y, z) / 2, Math.min(y, z) / 2, x, 32);
    g.rotateZ(-Math.PI / 2);
    return g;
  }
  return new THREE.BoxGeometry(x, y, z);
}
function matrixOf(cf) {
  const m = new THREE.Matrix4();
  m.set(cf[3], cf[4], cf[5], cf[0], cf[6], cf[7], cf[8], cf[1], cf[9], cf[10], cf[11], cf[2], 0, 0, 0, 1);
  return m;
}

for (const p of data.parts) {
  const mesh = new THREE.Mesh(geometry(p), material(p));
  mesh.matrixAutoUpdate = false;
  mesh.matrix.copy(matrixOf(p.cf));
  mesh.castShadow = p.t < 0.5 && p.m !== 'Neon' && p.m !== 'ForceField';
  mesh.receiveShadow = true;
  scene.add(mesh);
}
for (const t of data.terrain) {
  const water = t.m === 'Water';
  const m = water
    ? new THREE.MeshStandardMaterial({ color: 0x1f8fd0, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.85 })
    : new THREE.MeshStandardMaterial({ color: t.m === 'Grass' ? 0x5fa040 : t.m === 'Sand' ? 0xe0cd90 : 0x8a8a90, roughness: 0.9 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(t.sz[0], t.sz[1], t.sz[2]), m);
  mesh.matrixAutoUpdate = false;
  mesh.matrix.copy(matrixOf(t.cf));
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// Написи SurfaceGui
const FACE = {
  Front: [new THREE.Vector3(0, 0, -1), new THREE.Euler(0, Math.PI, 0)],
  Back: [new THREE.Vector3(0, 0, 1), new THREE.Euler(0, 0, 0)],
  Top: [new THREE.Vector3(0, 1, 0), new THREE.Euler(-Math.PI / 2, 0, 0)],
  Bottom: [new THREE.Vector3(0, -1, 0), new THREE.Euler(Math.PI / 2, 0, 0)],
  Right: [new THREE.Vector3(1, 0, 0), new THREE.Euler(0, Math.PI / 2, 0)],
  Left: [new THREE.Vector3(-1, 0, 0), new THREE.Euler(0, -Math.PI / 2, 0)],
};
for (const t of data.texts) {
  const [normal, euler] = FACE[t.face] || FACE.Front;
  const [x, y, z] = t.sz;
  const fw = t.face === 'Right' || t.face === 'Left' ? z : x;
  const fh = t.face === 'Top' || t.face === 'Bottom' ? z : y;
  const ppu = 40;
  const cw = Math.min(1024, Math.max(32, Math.round(fw * ppu))), ch = Math.min(1024, Math.max(32, Math.round(fh * ppu)));
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  const lines = t.text.split('\n');
  let size = ch / lines.length * 0.8;
  ctx.font = `900 ${size}px sans-serif`;
  const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
  if (widest > cw * 0.95) size *= cw * 0.95 / widest;
  ctx.font = `900 ${size}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.12; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.fillStyle = `rgb(${t.col.map(c => Math.round(c * 255)).join(',')})`;
  lines.forEach((l, i) => {
    const yy = ch / 2 + (i - (lines.length - 1) / 2) * size * 1.1;
    ctx.strokeText(l, cw / 2, yy); ctx.fillText(l, cw / 2, yy);
  });
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  const half = new THREE.Vector3(x / 2, y / 2, z / 2);
  const offset = normal.clone().multiply(half).add(normal.clone().multiplyScalar(0.03));
  const local = new THREE.Matrix4().makeRotationFromEuler(euler).setPosition(offset);
  plane.matrixAutoUpdate = false;
  plane.matrix.copy(matrixOf(t.cf).multiply(local));
  scene.add(plane);
}

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const pointLights = [];
for (let i = 0; i < 24; i++) {
  const l = new THREE.PointLight(0xffffff, 0, 10, 1.2);
  pointLights.push(l); scene.add(l);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.5, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// view: { pos, target, fov, night, sky:[top,bottom], fog:[color, near, far], sunDir, sunColor, sunIntensity, ambient:[sky,ground,intensity], bloom }
window.renderView = (view) => {
  camera.position.set(...view.pos);
  camera.fov = view.fov || 60;
  camera.updateProjectionMatrix();
  const target = new THREE.Vector3(...view.target);
  camera.lookAt(target);
  const [top, bottom] = view.sky || ['#6fb6ff', '#d8ecff'];
  const sky = document.createElement('canvas'); sky.width = 2; sky.height = 256;
  const g = sky.getContext('2d'); const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, top); grad.addColorStop(1, bottom); g.fillStyle = grad; g.fillRect(0, 0, 2, 256);
  const skyTex = new THREE.CanvasTexture(sky); skyTex.colorSpace = THREE.SRGBColorSpace;
  scene.background = skyTex;
  const [fogColor, near, far] = view.fog || [bottom, 300, 1400];
  scene.fog = new THREE.Fog(fogColor, near, far);
  const [hs, hg, hi] = view.ambient || ['#cfe6ff', '#7a8f6a', 0.75];
  hemi.color.set(hs); hemi.groundColor.set(hg); hemi.intensity = hi;
  const dir = new THREE.Vector3(...(view.sunDir || [0.4, 1, 0.3])).normalize();
  sun.color.set(view.sunColor || '#fff3dc'); sun.intensity = view.sunIntensity ?? 2.8;
  sun.position.copy(target).addScaledVector(dir, 400); sun.target.position.copy(target);
  const r = view.shadowRadius || 180;
  Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 1, far: 1000 });
  sun.shadow.camera.updateProjectionMatrix();
  renderer.toneMappingExposure = view.exposure || 1;
  bloom.strength = view.bloom ?? 0.5;
  const lights = data.lights.map(l => ({ l, d: Math.hypot(l.p[0] - target.x, l.p[1] - target.y, l.p[2] - target.z) }))
    .sort((a, b) => a.d - b.d).slice(0, pointLights.length);
  pointLights.forEach((pl, i) => {
    const entry = lights[i];
    if (!entry || entry.d > 400) { pl.intensity = 0; return; }
    pl.position.set(...entry.l.p); pl.color.setRGB(...entry.l.col);
    pl.distance = entry.l.r * 1.4; pl.intensity = entry.l.b * (view.night ? 12 : 10);
  });
  composer.render();
  return true;
};
window.sceneReady = true;
</script>
</body>
</html>
